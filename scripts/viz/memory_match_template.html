{{title}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One deliberate look: a card table. Painted explicitly, identical on light and dark hosts. */
:root{
  --felt:#1E4A40; --felt-deep:#153830; --rail:#0F2A24; --edge:#2F6558; --chalk:#E7F0EA; --chalk-dim:#A9C2B8;
  --card:#F6F7F2; --card-ink:#1B2623; --card-line:#D5DAD2; --back:#7A2E3B; --back-line:#A34B59;
  --same:#F0A445; --diff:#86B9EC; --ok:#6FD497; --bad:#F2837A; --you:#E9D46A;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--rail);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:18px;padding-block:26px 44px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:8px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang a{color:var(--chalk-dim);font-family:var(--mono);font-size:13px}
.lang a:hover,.lang a:focus-visible{color:var(--chalk)}
.stamp{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.06em;border:1.5px solid var(--bad);color:var(--bad);padding:3px 8px;border-radius:3px;transform:rotate(-1.5deg)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.2vw,50px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;max-width:66ch;color:var(--chalk-dim)}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
button,select{font:inherit;font-size:14px;color:var(--chalk);background:var(--felt-deep);border:1px solid var(--edge);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--chalk-dim)}
button:focus-visible,select:focus-visible,input:focus-visible+.switch{outline:2px solid var(--you);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.lbl{font-family:var(--mono);font-size:13px;color:var(--chalk-dim)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.switch{width:38px;height:22px;border-radius:99px;background:var(--felt-deep);border:1px solid var(--edge);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--chalk-dim);transition:transform .2s,background .2s}
.toggle input:checked+.switch{background:#5D5424}
.toggle input:checked+.switch::after{transform:translateX(16px);background:var(--you)}

.table{background:radial-gradient(120% 90% at 50% 20%,var(--felt) 0%,var(--felt-deep) 100%);border:10px solid var(--rail);box-shadow:inset 0 0 0 1px var(--edge);border-radius:26px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px}
.progress{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:13px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.stage{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slotlabel{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);letter-spacing:.05em}
.cardbox{width:100%;max-width:220px;aspect-ratio:5/7;perspective:900px}
.pile{position:relative;width:100%;max-width:150px;aspect-ratio:5/7}
.pile:empty{border:1.5px dashed var(--edge);border-radius:12px}
.pile .card{position:absolute;inset:0;transform:translate(var(--ox,0px),var(--oy,0px)) rotate(var(--rz,0deg))}
.pile .card.down{transform:translate(var(--ox,0px),var(--oy,0px)) rotate(var(--rz,0deg)) rotateY(180deg)}
.card.flying{position:fixed;z-index:50;margin:0;pointer-events:none;transition:none}
.card{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1),opacity .3s;transform-style:preserve-3d}
.card.down{transform:rotateY(180deg)}
.card.gone{opacity:0;transform:translateX(30px)}
.card.empty{opacity:0}
.face,.backface{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face{background:var(--card);color:var(--card-ink);border:1px solid var(--card-line);padding:11px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.backface{transform:rotateY(180deg);background:var(--back);border:1px solid var(--back-line);box-shadow:0 8px 18px rgba(0,0,0,.28);
  background-image:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,255,255,.08) 7px 8px),repeating-linear-gradient(-45deg,transparent 0 7px,rgba(255,255,255,.08) 7px 8px)}
.corner{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#5D6B66}
.oname{font-family:var(--display);font-weight:600;font-size:clamp(14px,2.2vw,20px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.pile .oname{font-size:clamp(12px,1.6vw,15px)}
.fp{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.fp svg{width:100%;height:auto;display:block}
.fplabel{font-family:var(--mono);font-size:9.5px;color:#6B7873}

.ask{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.question{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.6vw,24px);line-height:1.2;text-wrap:balance}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{font-family:var(--body);font-weight:600;font-size:16px;padding:12px 8px;border-radius:10px;color:#1B2623;border:none}
.answers .no{background:var(--diff)} .answers .yes{background:var(--same)}
.answers .key{display:block;font-family:var(--mono);font-size:11px;font-weight:400;opacity:.75}
.timer{height:5px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--you);transform-origin:left;transform:scaleX(0)}
.truth{min-height:26px;font-family:var(--display);font-weight:600;font-size:18px}

.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seat{background:rgba(0,0,0,.18);border:1px solid var(--edge);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.seat.you{border-color:#8C7F3A}
.seat h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0;line-height:1.2}
.avatar{height:48px;display:flex;align-items:center;justify-content:center}
.youbadge{font-family:var(--display);font-weight:800;font-size:22px;color:var(--you)}
.paddle{font-weight:600;font-size:15px;padding:3px 12px;border-radius:8px;color:#1B2623;min-height:28px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .3s}
.paddle.up{opacity:1;transform:translateY(0) rotate(var(--tilt,0deg))}
.mark{font-family:var(--mono);font-size:13px;min-height:20px}
.meta{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:10px;row-gap:1px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.meta dt{text-align:left}.meta dd{margin:0;text-align:right;color:var(--chalk)}

.notes{font-size:13px;color:var(--chalk-dim);max-width:74ch;display:flex;flex-direction:column;gap:8px}
.notes p{margin:0}
.notes strong{color:var(--chalk)}
.verdicts{display:flex;flex-wrap:wrap;gap:6px}
.v{font-family:var(--mono);font-size:12px;border:1px solid var(--edge);border-radius:5px;padding:2px 7px}
.v.t{color:var(--ok);border-color:var(--ok)} .v.x{color:var(--chalk-dim)}

@media (max-width:700px){
  .stage{grid-template-columns:minmax(0,.8fr) minmax(0,1fr)}
  .ask{grid-column:1 / -1}
  .seats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){ .card,.paddle,.switch,.switch::after{transition:none} }
</style>

<div class="wrap">
  <header>
    <div class="topline"><span class="stamp">{{stamp}}</span><nav class="lang">{{lang}}</nav></div>
    {{h1}}
    {{lede}}
  </header>

  <div class="bar">
    {{bar_play}}
    {{bar_restart}}
    {{bar_speed}}
    <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <label class="toggle" for="join"><input type="checkbox" id="join">{{bar_join}}
  </div>

  <section class="table" {{aria_table}}>
    <div class="progress"><span id="count"></span><span id="trialref"></span></div>
    <div class="stage">
      <div class="slot"><div class="pile" id="pile"></div>{{prev}}</div>
      <div class="slot"><div class="cardbox"><div class="card empty" id="cur"></div></div>{{cur}}</div>
      <div class="ask">
        {{q_first_html}}
        <div class="answers" id="answers" hidden>
          <button type="button" class="no" id="ansNo">{{ans_no}}</button>
          <button type="button" class="yes" id="ansYes">{{ans_yes}}</button>
        </div>
        <div class="timer" id="timer" hidden><i id="timerbar"></i></div>
        <div class="truth" id="truth" aria-live="polite"></div>
      </div>
    </div>
    <div class="seats" id="seats"></div>
  </section>

  <div class="notes">
    <div class="verdicts" id="verdicts"></div>
{{note0}}{{note1}}{{note2}}{{note3}}  </div>
</div>

<script id="flydata" type="application/json">__FLYDATA__</script>
<script id="i18n" type="application/json">__I18N__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("flydata").textContent);
  const STILL = Math.max(0, parseInt(new URLSearchParams(location.search).get("still") || "0", 10) || 0);   // ?still=N: no motion, stop at comparison N revealed
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || STILL > 0;
  const T = JSON.parse(document.getElementById("i18n").textContent);
  const CLASS_KO = T.classes;
  const ANSWER_MS = 6000;
  const $ = id => document.getElementById(id);

  const fly = `<svg viewBox="0 0 60 60" width="46" height="46" aria-hidden="true"><g stroke="#0E1512" stroke-width="2" stroke-linecap="round" fill="none"><path d="M22 30 L12 22 M22 34 L10 34 M24 38 L13 47 M38 30 L48 22 M38 34 L50 34 M36 38 L47 47"/></g><ellipse cx="22" cy="27" rx="11" ry="6" fill="rgba(200,230,240,.55)" transform="rotate(-25 22 27)"/><ellipse cx="38" cy="27" rx="11" ry="6" fill="rgba(200,230,240,.55)" transform="rotate(25 38 27)"/><ellipse cx="30" cy="36" rx="7" ry="12" fill="#2A1F17"/><circle cx="30" cy="21" r="6" fill="#2A1F17"/><circle cx="26.5" cy="19.5" r="2.6" fill="#C0392B"/><circle cx="33.5" cy="19.5" r="2.6" fill="#C0392B"/></svg>`;

  function makeSeat(name, you) {
    const el = document.createElement("div"); el.className = "seat" + (you ? " you" : "");
    el.innerHTML = `<h2>${name}</h2><div class="avatar">${you ? '<span class="youbadge">' + T.you + '</span>' : fly}</div><span class="paddle"></span><div class="mark"></div><dl class="meta"></dl>`;
    return {el, name, you, paddle: el.querySelector(".paddle"), mark: el.querySelector(".mark"), meta: el.querySelector(".meta"), right: 0, n: 0, streak: 0, best: 0};
  }
  const flies = D.arms.map((a, j) => Object.assign(makeSeat(T.arms[a.key], false), {j, acc: a.acc}));
  const me = makeSeat(T.you, true);
  function layoutSeats() {
    const box = $("seats"); box.innerHTML = "";
    if ($("join").checked) box.appendChild(me.el);
    flies.forEach(f => box.appendChild(f.el));
  }
  function meta(s) {
    const rows = [[T.deck, s.n ? `${s.right}/${s.n} · ${(100 * s.right / s.n).toFixed(0)}%` : "–"], [T.streak, `${s.streak} · ${T.best} ${s.best}`]];
    if (!s.you) rows.push([T.bench, `${(s.acc * 100).toFixed(1)}%`]);
    s.meta.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  for (const [k, v] of Object.entries(D.verdicts || {})) {
    if (!/^V[2-6]|^WIRING/.test(k)) continue;
    const s = document.createElement("span"); s.className = "v " + (v === true ? "t" : "x");
    s.textContent = `${T.vn[k.split(" ")[0]] || k}: ${v === true ? T.pass : v === false ? T.fail : v === "VOID" ? T.void : v}`;
    $("verdicts").appendChild(s);
  }

  function fingerprint(fp) {
    const w = 161, h = 44, mid = 32, sc = 30 / 300;
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${T.fp_aria}">${fp.map((v, i) => {
      const len = Math.max(0.8, Math.abs(v) * sc);
      return `<rect x="${i * 7 + 1}" y="${v >= 0 ? mid - len : mid}" width="5" height="${len}" fill="${v >= 0 ? "#2E6B5B" : "#B14A3E"}"/>`;
    }).join("")}<line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="#9AA59F" stroke-width=".6"/></svg>`;
  }
  function fill(el, oi, k) {
    const o = D.odors[oi];
    el.innerHTML = `<div class="face"><div class="corner"><span>${CLASS_KO[o.cls] || o.cls}</span><span>${T.nth.replace("{n}", k + 1)}</span></div><div class="oname">${o.name}</div><div class="fp">${fingerprint(o.fp)}<span class="fplabel">${T.fp_label}</span></div></div><div class="backface"></div>`;
  }

  let token = 0, playing = true, speed = 1, timers = [], answerResolve = null;
  const wait = ms => new Promise(r => timers.push(setTimeout(r, reduce ? Math.min(ms, 400) : ms / speed)));
  async function paused(my) { while (!playing && my === token) await new Promise(r => setTimeout(r, 120)); }

  function askHuman(my) {
    return new Promise(resolve => {
      $("answers").hidden = false; $("timer").hidden = false;
      const bar = $("timerbar"); bar.style.transition = "none"; bar.style.transform = "scaleX(1)";
      requestAnimationFrame(() => { bar.style.transition = `transform ${ANSWER_MS}ms linear`; bar.style.transform = "scaleX(0)"; });
      const done = v => { if (answerResolve !== finish) return; finish(v); };
      const finish = v => { answerResolve = null; clearTimeout(to); $("answers").hidden = true; $("timer").hidden = true; resolve(v); };
      const to = setTimeout(() => done(null), ANSWER_MS);
      answerResolve = finish;
      $("ansNo").onclick = () => done(false); $("ansYes").onclick = () => done(true);
    });
  }
  addEventListener("keydown", e => {
    if (!answerResolve) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); answerResolve(false); }
    if (e.key === "ArrowRight") { e.preventDefault(); answerResolve(true); }
  });

  function score(s, said, truth) {
    const ok = said === truth; s.n++; if (ok) { s.right++; s.streak++; s.best = Math.max(s.best, s.streak); } else s.streak = 0;
    s.mark.textContent = said === null ? T.timeout : ok ? T.right : T.wrong;
    s.mark.style.color = ok ? "var(--ok)" : "var(--bad)";
    meta(s);
  }
  function showPaddle(s, same, doubt) {
    if (same === null) { s.paddle.textContent = "…"; s.paddle.style.background = "var(--chalk-dim)"; }
    else { s.paddle.textContent = same ? T.same : T.diff; s.paddle.style.background = same ? "var(--same)" : "var(--diff)"; }
    s.paddle.style.setProperty("--tilt", `${(same ? -1 : 1) * doubt * 22}deg`);
    s.paddle.className = "paddle up";
  }

  async function flyToPile(cur, pile, odor, k, my) {
    const n = Math.min(pile.children.length, 6);
    const ox = n * 2.5, oy = -n * 2.5, rz = (Math.random() * 8 - 4).toFixed(1);
    const cr = cur.getBoundingClientRect(), pr = pile.getBoundingClientRect();
    const flying = document.createElement("div");
    flying.className = "card flying"; flying.innerHTML = cur.innerHTML;
    Object.assign(flying.style, {left: cr.left + "px", top: cr.top + "px", width: cr.width + "px", height: cr.height + "px"});
    document.body.appendChild(flying); cur.className = "card empty";
    const dx = pr.left + pr.width / 2 + ox - (cr.left + cr.width / 2), dy = pr.top + pr.height / 2 + oy - (cr.top + cr.height / 2);
    const s = pr.width / cr.width;
    if (!reduce && flying.animate) {
      const anim = flying.animate([
        {transform: "perspective(900px) translate(0px,0px) scale(1) rotate(0deg) rotateY(0deg)"},
        {transform: `perspective(900px) translate(${dx * .55}px,${dy * .55 - 40}px) scale(${(1 + s) / 2}) rotate(${rz / 2}deg) rotateY(90deg)`, offset: .5},
        {transform: `perspective(900px) translate(${dx}px,${dy}px) scale(${s}) rotate(${rz}deg) rotateY(180deg)`}
      ], {duration: 700 / speed, easing: "cubic-bezier(.35,.6,.3,1)", fill: "forwards"});
      try { await anim.finished; } catch (e) {}
    }
    flying.remove();
    if (my !== token) return;
    const landed = document.createElement("div");
    landed.className = "card down";
    landed.style.setProperty("--ox", ox + "px"); landed.style.setProperty("--oy", oy + "px"); landed.style.setProperty("--rz", rz + "deg");
    fill(landed, odor, k); pile.appendChild(landed);
    while (pile.children.length > 7) pile.firstElementChild.remove();
    [...pile.children].forEach((c, i, all) => {
      const m = all.length - 1 - i;                     // restack so the newest sits highest
      const off = (Math.min(all.length - 1, 6) - m) * 2.5;
      c.style.setProperty("--ox", off + "px"); c.style.setProperty("--oy", -off + "px");
    });
  }

  async function run() {
    const my = ++token; timers.forEach(clearTimeout); timers = [];
    if (answerResolve) answerResolve(null);
    [...flies, me].forEach(s => { s.right = s.n = s.streak = s.best = 0; s.mark.textContent = ""; s.paddle.className = "paddle"; meta(s); });
    layoutSeats();
    const pile = $("pile"), cur = $("cur");
    document.querySelectorAll(".card.flying").forEach(el => el.remove());
    pile.innerHTML = ""; cur.className = "card gone";
    fill(cur, D.cards[0], 0);
    await wait(200); if (my !== token) return;
    cur.className = "card"; $("question").textContent = T.q_first; $("truth").textContent = "";
    $("count").textContent = T.count.replace("{a}", 1).replace("{b}", D.cards.length); $("trialref").textContent = "";
    await wait(1800); if (my !== token) return;

    for (let k = 1; k < D.cards.length; k++) {
      await paused(my); if (my !== token) return;
      const step = D.steps[k - 1];
      const top = pile.lastElementChild;
      if (top && !top.classList.contains("down")) { top.classList.add("down"); await wait(250); if (my !== token) return; }
      await flyToPile(cur, pile, D.cards[k - 1], k - 1, my); if (my !== token) return;
      cur.className = "card gone";
      [...flies, me].forEach(s => { s.paddle.className = "paddle"; s.mark.textContent = ""; });
      $("truth").textContent = ""; $("question").textContent = T.q_ask;
      await wait(260); if (my !== token) return;
      fill(cur, D.cards[k], k); cur.className = "card";
      $("count").textContent = T.count.replace("{a}", k + 1).replace("{b}", D.cards.length);
      $("trialref").textContent = T.item.replace("{n}", step.trial);

      let mine;
      if ($("join").checked) { mine = await askHuman(my); if (my !== token) return; showPaddle(me, mine, 0); }
      else { await wait(1100); if (my !== token) return; }

      flies.forEach(f => { const p = step.p[f.j]; showPaddle(f, p > 0.5, 1 - Math.abs(2 * p - 1)); });
      await wait(1100); if (my !== token) return;

      pile.lastElementChild.classList.remove("down");
      $("truth").textContent = step.same ? T.truth_same : T.truth_diff;
      $("truth").style.color = step.same ? "var(--same)" : "var(--diff)";
      flies.forEach(f => score(f, step.p[f.j] > 0.5, step.same));
      if ($("join").checked) score(me, mine, step.same);
      if (STILL && k === STILL) { playing = false; $("play").textContent = T.play; }
      await wait(1700); if (my !== token) return;
    }
    $("question").textContent = T.end;
    $("trialref").textContent = "";
  }

  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? T.pause : T.play; };
  $("restart").onclick = run;
  $("speed").onchange = e => { speed = +e.target.value; };
  $("join").onchange = run;
  run();
})();
</script>
